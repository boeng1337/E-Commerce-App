name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-arch:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Install base deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git base-devel curl wget file openssl \
            webkit2gtk-4.1 librsvg libappindicator-gtk3 nodejs npm rustup fuse2 \
            desktop-file-utils mesa zsync gtk3

      - name: Trust the workspace directory
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup default stable

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Arch, binary only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src-tauri
        run: |
          cargo build --release --features custom-protocol

      - name: Package as self-extracting single file
        run: |
          mkdir -p dist-arch
          cp src-tauri/target/release/aliexpress-manager dist-arch/
          cp -r src-tauri/icons dist-arch/ || true

          mkdir -p dist-arch/python
          cp python/ae_client.py python/ae_cli.py python/ae_auth_cli.py \
             python/config.py python/requirements.txt dist-arch/python/
          # api_keys.env is intentionally NOT bundled -- it's gitignored and
          # holds real secrets. The persistent extract dir preserves it
          # across re-extractions (tar never deletes files absent from the
          # archive), so once you save credentials in-app they survive
          # every future run/update of this package.

          tar -czf payload.tar.gz -C dist-arch .

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -e' \
            'PERSIST_DIR="$HOME/.local/share/aliexpress-manager"' \
            'mkdir -p "$PERSIST_DIR"' \
            'ARCHIVE_LINE=$(grep -an "^__PAYLOAD_BELOW__$" "$0" | head -1 | cut -d: -f1)' \
            'ARCHIVE_LINE=$((ARCHIVE_LINE + 1))' \
            'tail -n +"$ARCHIVE_LINE" "$0" | tar -xz -C "$PERSIST_DIR"' \
            'VENV_DIR="$PERSIST_DIR/python/.venv"' \
            'if [ ! -d "$VENV_DIR" ]; then' \
            '  echo "First run: setting up Python environment (this happens once)..."' \
            '  python3 -m venv "$VENV_DIR"' \
            '  "$VENV_DIR/bin/pip" install --quiet -r "$PERSIST_DIR/python/requirements.txt"' \
            'fi' \
            'export AE_PYTHON_BIN="$VENV_DIR/bin/python3"' \
            'export WEBKIT_DISABLE_DMABUF_RENDERER=1' \
            'exec "$PERSIST_DIR/aliexpress-manager" "$@"' \
            '__PAYLOAD_BELOW__' > aliexpress-manager-arch.run

          cat payload.tar.gz >> aliexpress-manager-arch.run
          chmod +x aliexpress-manager-arch.run

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Listing Manager ${{ github.ref_name }}"
          body: "Personal build. Download aliexpress-manager-arch.run, chmod +x it, and run it directly."
          draft: false
          prerelease: false
          files: |
            aliexpress-manager-arch.run
