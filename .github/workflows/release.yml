name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-arch:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Install base deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git base-devel curl wget file openssl \
            webkit2gtk-4.1 librsvg libappindicator-gtk3 nodejs npm rustup fuse2 \
            desktop-file-utils mesa zsync gtk3

      - name: Trust the workspace directory
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup default stable

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Arch, binary only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src-tauri
        run: |
          cargo build --release --features custom-protocol

      - name: Package raw binary
        run: |
          mkdir -p dist-arch
          cp src-tauri/target/release/aliexpress-manager dist-arch/
          cp -r src-tauri/icons dist-arch/ || true
          tar -czvf aliexpress-manager-arch-linux-x86_64.tar.gz -C dist-arch .

      - name: Upload Arch build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-linux-bundle
          path: |
            aliexpress-manager-arch-linux-x86_64.tar.gz

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: nick-fields/retry@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 15
          command: npx tauri build --ci

      - name: Create/update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Listing Manager ${{ github.ref_name }}"
          body: "Automated release. See CHANGELOG for details."
          draft: true
          prerelease: false
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
