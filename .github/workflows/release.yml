name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-arch:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Install base deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git base-devel curl wget file openssl \
            webkit2gtk-4.1 librsvg libappindicator-gtk3 nodejs npm rustup fuse2 \
            desktop-file-utils mesa zsync gtk3

      - name: Trust the workspace directory
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup default stable

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (Arch, binary only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src-tauri
        run: |
          cargo build --release --features custom-protocol

      - name: Package as self-extracting single file
        run: |
          mkdir -p dist-arch
          cp src-tauri/target/release/aliexpress-manager dist-arch/
          cp -r src-tauri/icons dist-arch/ || true

          # Build the payload archive
          tar -czf payload.tar.gz -C dist-arch .

          # Write the self-extracting stub: extracts itself to a temp dir,
          # sets the env var needed to avoid the WebKitGTK EGL/DMA-BUF issue
          # on Intel + Wayland/Hyprland setups, then runs the binary.
          cat > aliexpress-manager-arch.run << 'STUB_EOF'
#!/usr/bin/env bash
set -e
TMPDIR="$(mktemp -d /tmp/aliexpress-manager.XXXXXX)"
ARCHIVE_LINE=$(awk '/^__PAYLOAD_BELOW__/ {print NR + 1; exit 0}' "$0")
tail -n +"$ARCHIVE_LINE" "$0" | tar -xz -C "$TMPDIR"
export WEBKIT_DISABLE_DMABUF_RENDERER=1
exec "$TMPDIR/aliexpress-manager" "$@"
__PAYLOAD_BELOW__
STUB_EOF
          cat payload.tar.gz >> aliexpress-manager-arch.run
          chmod +x aliexpress-manager-arch.run

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Listing Manager ${{ github.ref_name }}"
          body: "Personal build. Download aliexpress-manager-arch.run, chmod +x it, and run it directly."
          draft: false
          prerelease: false
          files: |
            aliexpress-manager-arch.run
